[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "folio-hackathon-api"
version = "0.1.0"
description = "Fresh Folio API and worker for the Nebius hackathon"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.25,<5",
  "sqlalchemy>=2,<3",
  "psycopg[binary]>=3,<4",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["folio_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
